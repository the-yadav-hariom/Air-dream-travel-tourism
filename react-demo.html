                <button

                    <span>Contact (+971 58 833 8927)</span>

      );
    }

    function SingleLineCards({ onBookTrip }) {
      const [openCardIndex, setOpenCardIndex] = useState(null);
      const trackRef = useRef(null);

      const scrollTrack = (direction) => {
        if (trackRef.current) {
          const scrollAmount = direction === 'left' ? -340 : 340;
          trackRef.current.scrollBy({ left: scrollAmount, behavior: 'smooth' });
        }
      };

      const handleCardClick = (index, cardElement, e) => {
        if (e.target.closest('.card-second-opened') && !e.target.closest('.card-close-x')) {
          return;
        }

        if (openCardIndex === index) {
          setOpenCardIndex(null);
        } else {
          setOpenCardIndex(index);
          setTimeout(() => {
            if (cardElement) {
              cardElement.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
          }, 150);
        }
      };

      return (
        <section className="section-padding why-choose-section" id="why-choose">
          <div className="curved-bg-shapes">
            <div className="bg-slant-left"></div>
            <div className="bg-diagonal-ribbon-grey"></div>
            <div className="bg-diagonal-ribbon-blue"></div>
            <div className="bg-blob-1"></div>
            <div className="bg-blob-2"></div>
          </div>

          <div className="container">
            <div className="section-header why-header-wrap">
              <h2 className="why-choose-heading">
                Why Choose <span className="text-sky">Borderlink</span><br />Travel &amp; Tours?
              </h2>
              <p className="section-subtitle" style={{ marginTop: '10px', fontSize: '0.95rem', color: '#64748B' }}>
                Explore our premium travel services &bull; Click any card to view full details
              </p>
              <div className="mobile-swipe-hint">
                <i className="fa-solid fa-arrow-pointer"></i>
                <span>Tap any card to view full details</span>
              </div>
            </div>

            {/* Cards Container (Row-wise on Laptop, Column-wise on Mobile) */}
            <div className="single-line-carousel-wrapper">
              <div className="single-line-cards-track" ref={trackRef}>
                {CARDS_DATA.map((card, index) => {
                  const isOpen = openCardIndex === index;
                  return (
                    <div 
                      key={card.id} 
                      className={`single-line-card-item ${isOpen ? 'is-card-open' : ''}`}
                      onClick={(e) => handleCardClick(index, e.currentTarget, e)}
                    >
                      <div className="dual-card-stage">
                        {/* Upper Second White Card matching Reference Image 2 */}
                        <div className="card-second-opened">
                          <button type="button" className="card-close-x" onClick={(e) => { e.stopPropagation(); setOpenCardIndex(null); }}>&times;</button>
                          <div className="card-second-body">
                            <div className="card-second-icon">{card.icon}</div>
                            <h3 className="card-second-title">{card.titleFormatted}</h3>
                            <p className="card-second-desc">{card.desc}</p>
                            <button 
                              type="button" 
                              className="btn btn-gold btn-sm card-second-cta"
                              onClick={(e) => { e.stopPropagation(); onBookTrip(card.title, card.price); }}
                            >
                              <i className="fa-solid fa-plane-departure"></i> Book Trip ({card.price})
                            </button>
                          </div>
                        </div>

                        {/* Front Photo Card */}
                        <div className="card-front-cover">
                          <img src={card.image} onError={(e) => { e.target.onerror = null; e.target.src = card.fallback; }} alt={card.title} className="card-photo-img" />
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        </section>
      );
    }

    function HeroSection({ onOpenQuote, wallpapers }) {
      const activeSlide = (wallpapers && wallpapers.length > 0) ? wallpapers[0] : {
        badge: 'Premium Flight Booking',
        badgeIcon: 'fa-plane',
        title: 'Fly Anywhere at the',
        highlight: 'Best Fares',
        desc: 'Experience seamless global connections with world-class airlines. Unlock corporate discounts, flexible baggage, and 24/7 personalized travel care.',
        image: 'https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=1920&q=80'

      return (
        <section className="hero-section" id="hero">
          <div className="hero-slider-container">
            <div className="hero-slide active">
              <div className="hero-slide-bg" style={{ backgroundImage: `url('${activeSlide.image}')` }}></div>
              <div className="hero-overlay"></div>
              <div className="container">
                <div className="hero-content">
                  <div className="hero-badge"><i className={`fa-solid ${activeSlide.badgeIcon || 'fa-plane'}`}></i> {activeSlide.badge}</div>

      { id: 8, name: 'Dubai Miracle Garden', activities: '52 activities', img: 'https://images.unsplash.com/photo-1561571994-3c3915177263?auto=format&fit=crop&w=700&q=80', price: '$28' }

    function AttractionsSection({ onBookAttraction, items }) {
      const list = (items && items.length > 0) ? items : DUBAI_ATTRACTIONS_DATA;

      return (
        <section className="section-padding attractions-section" id="attractions">
          <div className="container">
            <div className="attractions-header">
              <div style={{ display: 'inline-flex', alignItems: 'center', gap: '6px', background: '#E0F2FE', color: '#0369A1', padding: '4px 14px', borderRadius: '999px', fontSize: '0.78rem', fontWeight: 700, textTransform: 'uppercase', marginBottom: '8px' }}>
                <i className="fa-solid fa-star text-gold"></i> Must-Visit Landmarks

              <h2 className="attractions-title">Top Dubai Attractions</h2>

          <div className="attractions-marquee-container">

              {list.map((item, idx) => (

                  <div className="attraction-info">

                    <p className="attraction-activities">{item.activities}</p>

                        <span className="tour-price-unit">/person</span>
                      </div>
                      <button type="button" className="btn-book-tour">{item.btnText || 'Book Now'}</button>

                  </div>

              ))}
              {list.map((item, idx) => (
                <div key={`att2-${item.id || idx}`} className="attraction-card" aria-hidden="true" onClick={() => onBookAttraction(item.name, item.price)}>
                  <div className="attraction-img-wrapper">
                    <img src={item.image || item.img} alt={item.name} className="attraction-img" loading="lazy" />
                  </div>
                  <div className="attraction-info">

                    <p className="attraction-activities">{item.activities}</p>

            </div>

            {/* Arched Photo Frame with Floating Bubbles (Image 4) */}
            <div className="about-visual-stage">
              <div className="about-arch-outer">
                <div className="about-arch-inner">
                  <img src={archImg} alt="Salalah Traveler" className="about-arch-img" loading="lazy" />
                </div>
              </div>
              <div className="about-bubble-1" title="Wadi Darbat Waterfalls">

        </div>
      );

    function App() {
      const [modalOpen, setModalOpen] = useState(false);
      const [modalTitle, setModalTitle] = useState('Inquiry');
      const [siteData, setSiteData] = useState(() => (typeof AirDreamStore !== 'undefined' ? AirDreamStore.getData() : {}));

      useEffect(() => {
        if (typeof AirDreamStore !== 'undefined') {
          return AirDreamStore.subscribe((newData) => {
            setSiteData({ ...newData });
          });
        }
      }, []);

      const handleOpenQuote = (title) => {
        setModalTitle(title);
        setModalOpen(true);
      };

      const handleBookTrip = (packageTitle, price) => {
        setModalTitle(`Book: ${packageTitle} (${price})`);
        setModalOpen(true);
      };

      const handleBookAttraction = (name, price) => {
        setModalTitle(`Book Attraction: ${name} (${price})`);
        setModalOpen(true);
      };

      return (
        <div>
          <Navbar onOpenQuote={handleOpenQuote} logoUrl={siteData.settings?.logoUrl} />
          <HeroSection onOpenQuote={handleOpenQuote} wallpapers={siteData.wallpapers} />
          <PartnersSection />
          <SingleLineCards onBookTrip={handleBookTrip} />
          <AttractionsSection onBookAttraction={handleBookAttraction} items={siteData.attractions} />
          <AboutSection onOpenQuote={handleOpenQuote} settings={siteData.settings} />
          <ToursSection onBookTour={handleBookTrip} items={siteData.tours} />
          <AirportTransferSection onBookTransfer={handleBookTrip} items={siteData.transfers} />
          <GallerySection onOpenPhoto={handleBookTrip} items={siteData.gallery} />
          <ReviewsSection items={siteData.reviews} />
          <BookingModal isOpen={modalOpen} title={modalTitle} onClose={() => setModalOpen(false)} />


        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
